  <text x="380" y="405" text-anchor="middle" font-family="Arial" font-size="18" fill="#374151">Любая прямая оставляет соседние точки разных классов по одну сторону</text>
  <text x="380" y="432" text-anchor="middle" font-family="Arial" font-size="18" fill="#374151">→ чередующуюся разметку нельзя реализовать</text>
