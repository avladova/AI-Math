<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Доля правильных ответов accuracy</title>
  <desc id="desc">Схема из двадцати объектов: шестнадцать классифицированы правильно, четыре неправильно. Accuracy равна 80 процентам.</desc>
  <rect width="900" height="500" fill="#fbfaf7"/>
  <text x="450" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#172235">Accuracy: доля правильных ответов</text>
  <text x="450" y="74" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#566274">Чем больше доля зелёных ячеек, тем выше показатель</text>
  <rect x="90" y="125" width="720" height="220" rx="18" fill="#ffffff" stroke="#dce2ea" stroke-width="2"/>
  <g stroke="#ffffff" stroke-width="4">
    <rect x="125" y="165" width="64" height="64" rx="8" fill="#1d7a74"/><rect x="195" y="165" width="64" height="64" rx="8" fill="#1d7a74"/><rect x="265" y="165" width="64" height="64" rx="8" fill="#1d7a74"/><rect x="335" y="165" width="64" height="64" rx="8" fill="#1d7a74"/><rect x="405" y="165" width="64" height="64" rx="8" fill="#1d7a74"/><rect x="475" y="165" width="64" height="64" rx="8" fill="#1d7a74"/><rect x="545" y="165" width="64" height="64" rx="8" fill="#1d7a74"/><rect x="615" y="165" width="64" height="64" rx="8" fill="#1d7a74"/><rect x="685" y="165" width="64" height="64" rx="8" fill="#1d7a74"/>
    <rect x="125" y="235" width="64" height="64" rx="8" fill="#1d7a74"/><rect x="195" y="235" width="64" height="64" rx="8" fill="#1d7a74"/><rect x="265" y="235" width="64" height="64" rx="8" fill="#1d7a74"/><rect x="335" y="235" width="64" height="64" rx="8" fill="#1d7a74"/><rect x="405" y="235" width="64" height="64" rx="8" fill="#1d7a74"/><rect x="475" y="235" width="64" height="64" rx="8" fill="#1d7a74"/><rect x="545" y="235" width="64" height="64" rx="8" fill="#1d7a74"/><rect x="615" y="235" width="64" height="64" rx="8" fill="#d26a4b"/><rect x="685" y="235" width="64" height="64" rx="8" fill="#d26a4b"/>
    <rect x="755" y="165" width="40" height="64" rx="8" fill="#d26a4b"/><rect x="755" y="235" width="40" height="64" rx="8" fill="#d26a4b"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="16" font-weight="700"><text x="350" y="380" text-anchor="middle" fill="#155b57">16 правильных ответов</text><text x="650" y="380" text-anchor="middle" fill="#a4553d">4 ошибки</text></g>
  <line x1="125" y1="420" x2="680" y2="420" stroke="#1d7a74" stroke-width="5"/><line x1="685" y1="420" x2="795" y2="420" stroke="#d26a4b" stroke-width="5"/>
  <text x="450" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#172235">Accuracy = 16 / 20 = 0,8 = 80%</text>
</svg>
