<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Нижняя граница и избыточная ошибка</title>
  <desc id="desc">Кривая полной ошибки приближается к горизонтальной нижней границе; вертикальный отрезок показывает избыточную ошибку.</desc>
  <rect width="900" height="500" fill="#fbfaf7"/>
  <text x="450" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#172235">Полная ошибка приближается к нижней границе</text>
  <line x1="105" y1="420" x2="820" y2="420" stroke="#172235" stroke-width="3"/><line x1="105" y1="420" x2="105" y2="100" stroke="#172235" stroke-width="3"/>
  <polygon points="820,420 806,413 806,427" fill="#172235"/><polygon points="105,100 98,114 112,114" fill="#172235"/>
  <text x="465" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172235">Размер выборки n</text>
  <text x="32" y="265" text-anchor="middle" transform="rotate(-90 32 265)" font-family="Arial, sans-serif" font-size="18" fill="#172235">Ошибка L(n)</text>
  <line x1="105" y1="350" x2="820" y2="350" stroke="#d26a4b" stroke-width="4" stroke-dasharray="10 8"/>
  <text x="625" y="340" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#a4553d">нижняя граница L∞</text>
  <path d="M105 140 C180 205 250 265 340 305 C450 335 590 344 790 348" fill="none" stroke="#1d7a74" stroke-width="7" stroke-linecap="round"/>
  <circle cx="250" cy="265" r="7" fill="#1d7a74"/>
  <line x1="250" y1="265" x2="250" y2="350" stroke="#e19a45" stroke-width="5"/>
  <line x1="238" y1="265" x2="262" y2="265" stroke="#e19a45" stroke-width="3"/><line x1="238" y1="350" x2="262" y2="350" stroke="#e19a45" stroke-width="3"/>
  <text x="270" y="310" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#b36d1d">избыточная ошибка</text>
  <text x="270" y="331" font-family="Arial, sans-serif" font-size="14" fill="#b36d1d">E_excess(n)</text>
  <text x="112" y="132" font-family="Arial, sans-serif" font-size="16" fill="#1d7a74">полная ошибка L(n)</text>
  <text x="125" y="405" font-family="Arial, sans-serif" font-size="14" fill="#566274">маленькая выборка</text>
  <text x="690" y="405" font-family="Arial, sans-serif" font-size="14" fill="#566274">большая выборка</text>
</svg>
