<svg xmlns="http://www.w3.org/2000/svg" width="820" height="390" viewBox="0 0 820 390">
<rect width="820" height="390" fill="white"/>
<text x="410" y="28" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold">Остаток — вертикальное расстояние от прогноза до факта</text>
<line x1="70" y1="325" x2="760" y2="325" stroke="#374151" stroke-width="2"/><line x1="70" y1="55" x2="70" y2="325" stroke="#374151" stroke-width="2"/>
<polyline points="90,250 170,205 250,220 330,150 410,170 490,105 570,130 650,75 730,95" fill="none" stroke="#2563eb" stroke-width="4"/>
<polyline points="90,270 170,235 250,235 330,180 410,185 490,135 570,150 650,105 730,115" fill="none" stroke="#dc2626" stroke-width="4" stroke-dasharray="9 6"/>
<line x1="490" y1="135" x2="490" y2="105" stroke="#16a34a" stroke-width="4"/><polygon points="490,105 484,117 496,117" fill="#16a34a"/>
<text x="505" y="118" font-family="Arial" font-size="17" fill="#16a34a">eₜ = yₜ − ŷₜ</text>
<text x="745" y="88" text-anchor="end" font-family="Arial" font-size="16" fill="#2563eb">факт yₜ</text>
<text x="745" y="136" text-anchor="end" font-family="Arial" font-size="16" fill="#dc2626">прогноз ŷₜ</text>
<text x="410" y="365" text-anchor="middle" font-family="Arial" font-size="16" fill="#374151">по горизонтали — время t; по вертикали — значение показателя</text>
<g font-family="Arial" font-size="15" fill="#374151"><text x="410" y="350" text-anchor="middle">время t: 1 … 9</text><text x="18" y="190" transform="rotate(-90 18 190)">значение yₜ, ŷₜ (шкала 0 … 10)</text></g><line x1="570" y1="150" x2="650" y2="150" stroke="#16a34a" stroke-width="2" stroke-dasharray="5 4"/><text x="610" y="145" text-anchor="middle" font-family="Arial" font-size="14" fill="#16a34a">лаг k</text><text x="610" y="175" text-anchor="middle" font-family="Arial" font-size="14" fill="#16a34a">сравниваем eₜ и eₜ₋ₖ</text><text x="410" y="382" text-anchor="middle" font-family="Arial" font-size="14" fill="#374151">автокорреляция: насколько похожи остатки через один и тот же лаг</text>
<line x1="330" y1="312" x2="490" y2="312" stroke="#16a34a" stroke-width="3"/><polygon points="490,312 478,306 478,318" fill="#16a34a"/><polygon points="330,312 342,306 342,318" fill="#16a34a"/><text x="410" y="305" text-anchor="middle" font-family="Arial" font-size="14" fill="#16a34a">лаг k = расстояние между t−k и t</text><text x="330" y="145" text-anchor="middle" font-family="Arial" font-size="14" fill="#16a34a">eₜ₋ₖ</text><text x="490" y="92" text-anchor="middle" font-family="Arial" font-size="14" fill="#16a34a">eₜ</text>
</svg>
