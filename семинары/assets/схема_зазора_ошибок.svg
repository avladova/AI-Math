<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Ошибка обучения, ошибка теста и зазор</title>
  <desc id="desc">Две кривые показывают, как уменьшается ошибка обучения и теста при росте размера выборки; вертикальная стрелка показывает зазор.</desc>
  <rect width="900" height="520" fill="#fbfaf7"/>
  <text x="450" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#172235">Две кривые и зазор</text>
  <line x1="105" y1="430" x2="820" y2="430" stroke="#172235" stroke-width="3"/><line x1="105" y1="430" x2="105" y2="95" stroke="#172235" stroke-width="3"/>
  <polygon points="820,430 806,423 806,437" fill="#172235"/><polygon points="105,95 98,109 112,109" fill="#172235"/>
  <text x="465" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172235">Размер обучающей выборки n</text>
  <text x="32" y="270" text-anchor="middle" transform="rotate(-90 32 270)" font-family="Arial, sans-serif" font-size="18" fill="#172235">Ошибка</text>
  <g font-family="Arial, sans-serif" font-size="14" fill="#566274"><text x="105" y="453">10</text><text x="270" y="453">20</text><text x="450" y="453">40</text><text x="630" y="453">80</text><text x="790" y="453">160</text><text x="88" y="407" text-anchor="end">2</text><text x="88" y="315" text-anchor="end">4</text><text x="88" y="223" text-anchor="end">6</text><text x="88" y="131" text-anchor="end">8</text></g>
  <polyline points="105,380 270,365 450,340 630,305 790,280" fill="none" stroke="#4267a8" stroke-width="6" stroke-linecap="round"/>
  <polyline points="105,145 270,215 450,270 630,300 790,315" fill="none" stroke="#d26a4b" stroke-width="6" stroke-linecap="round"/>
  <g fill="#4267a8" stroke="#fbfaf7" stroke-width="3"><circle cx="105" cy="380" r="7"/><circle cx="270" cy="365" r="7"/><circle cx="450" cy="340" r="7"/><circle cx="630" cy="305" r="7"/><circle cx="790" cy="280" r="7"/></g>
  <g fill="#d26a4b" stroke="#fbfaf7" stroke-width="3"><circle cx="105" cy="145" r="7"/><circle cx="270" cy="215" r="7"/><circle cx="450" cy="270" r="7"/><circle cx="630" cy="300" r="7"/><circle cx="790" cy="315" r="7"/></g>
  <line x1="270" y1="215" x2="270" y2="365" stroke="#a4553d" stroke-width="3" stroke-dasharray="7 6"/>
  <text x="290" y="285" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#a4553d">зазор G(n)</text>
  <text x="615" y="270" font-family="Arial, sans-serif" font-size="16" fill="#4267a8">ошибка обучения</text>
  <text x="600" y="190" font-family="Arial, sans-serif" font-size="16" fill="#d26a4b">ошибка на тесте</text>
  <rect x="120" y="65" width="300" height="48" rx="10" fill="#fff1ec" stroke="#d26a4b"/><text x="270" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#8b4330">большой зазор: возможна высокая дисперсия</text>
</svg>
