<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Как читать кривую обучения</title>
  <desc id="desc">График ошибки на новых данных в зависимости от размера обучающей выборки.</desc>
  <rect width="900" height="500" fill="#fbfaf7"/>
  <text x="450" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#172235">Кривая обучения</text>
  <text x="450" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#566274">Больше данных — обычно меньше ошибка на новых объектах</text>
  <line x1="105" y1="420" x2="820" y2="420" stroke="#172235" stroke-width="3"/>
  <line x1="105" y1="420" x2="105" y2="105" stroke="#172235" stroke-width="3"/>
  <polygon points="820,420 806,413 806,427" fill="#172235"/>
  <polygon points="105,105 98,119 112,119" fill="#172235"/>
  <text x="465" y="468" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172235">Размер обучающей выборки n</text>
  <text x="33" y="265" text-anchor="middle" transform="rotate(-90 33 265)" font-family="Arial, sans-serif" font-size="18" fill="#172235">Ошибка на новых данных</text>
  <g font-family="Arial, sans-serif" font-size="14" fill="#566274">
    <text x="105" y="443" text-anchor="middle">10</text><text x="250" y="443" text-anchor="middle">20</text><text x="430" y="443" text-anchor="middle">40</text><text x="610" y="443" text-anchor="middle">80</text><text x="790" y="443" text-anchor="middle">160</text>
    <text x="88" y="412" text-anchor="end">2</text><text x="88" y="330" text-anchor="end">4</text><text x="88" y="248" text-anchor="end">6</text><text x="88" y="166" text-anchor="end">8</text>
  </g>
  <g stroke="#dce2ea" stroke-width="1"><line x1="250" y1="420" x2="250" y2="120"/><line x1="430" y1="420" x2="430" y2="120"/><line x1="610" y1="420" x2="610" y2="120"/><line x1="790" y1="420" x2="790" y2="120"/></g>
  <polyline points="105,160 250,225 430,300 610,350 790,370" fill="none" stroke="#1d7a74" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#1d7a74" stroke="#fbfaf7" stroke-width="3"><circle cx="105" cy="160" r="7"/><circle cx="250" cy="225" r="7"/><circle cx="430" cy="300" r="7"/><circle cx="610" cy="350" r="7"/><circle cx="790" cy="370" r="7"/></g>
  <path d="M610 350 C680 360 735 367 790 370" fill="none" stroke="#e19a45" stroke-width="3" stroke-dasharray="8 7"/>
  <text x="628" y="320" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#b36d1d">плато: добавка данных</text>
  <text x="628" y="341" font-family="Arial, sans-serif" font-size="15" fill="#b36d1d">даёт небольшой выигрыш</text>
  <rect x="120" y="105" width="235" height="58" rx="10" fill="#e6f3f1" stroke="#1d7a74"/>
  <text x="237" y="129" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#155b57">одна точка</text>
  <text x="237" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#155b57">одно значение ошибки</text>
  <path d="M245 165 L250 215" stroke="#1d7a74" stroke-width="2" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#1d7a74"/></marker></defs>
</svg>
