</style><rect class="bg" width="920" height="470"/><text class="ink" x="35" y="36">Диагностический выбор: какой компонент доминирует?</text><path class="axis" d="M460 105 L460 365 M235 235 L685 235"/><circle cx="460" cy="235" r="74" fill="#e6d5a9" stroke="#17212b" stroke-width="2"/><text class="ink" x="410" y="229">проверьте</text><text class="ink" x="419" y="251">MSE</text><rect x="50" y="95" width="160" height="70" rx="4" fill="#b4472f"/><text x="130" y="125" text-anchor="middle" fill="#fffdf7" font-family="Arial" font-size="16">Высокое</text><text x="130" y="146" text-anchor="middle" fill="#fffdf7" font-family="Arial" font-size="16">смещение</text><text class="small" x="54" y="195">усложнить класс</text><text class="small" x="54" y="212">добавить признаки</text><rect x="600" y="95" width="160" height="70" rx="4" fill="#1b4d89"/><text x="680" y="125" text-anchor="middle" fill="#fffdf7" font-family="Arial" font-size="16">Высокая</text><text x="680" y="146" text-anchor="middle" fill="#fffdf7" font-family="Arial" font-size="16">дисперсия</text><text class="small" x="604" y="195">регуляризация</text><text class="small" x="604" y="212">бэггинг / больше данных</text><rect x="50" y="305" width="160" height="70" rx="4" fill="#d2a934"/><text x="130" y="335" text-anchor="middle" fill="#fffdf7" font-family="Arial" font-size="16">Большой</text><text x="130" y="356" text-anchor="middle" fill="#fffdf7" font-family="Arial" font-size="16">шум</text><text class="small" x="54" y="405">улучшить данные</text><text class="small" x="54" y="422">или принять предел</text><rect x="600" y="305" width="160" height="70" rx="4" fill="#5d805f"/><text x="680" y="335" text-anchor="middle" fill="#fffdf7" font-family="Arial" font-size="16">Малая MSE,</text><text x="680" y="356" text-anchor="middle" fill="#fffdf7" font-family="Arial" font-size="16">плохой рисунок</text><text class="small" x="604" y="405">проверить валидацию</text><text class="small" x="604" y="422">и временной сдвиг</text></svg>