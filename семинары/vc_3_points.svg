<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420">
  <rect width="760" height="420" fill="white"/>
  <text x="380" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1f2937">3 точки общего положения: все 8 разметок реализуемы</text>
  <polygon points="180,330 560,330 370,90" fill="#eef6ff" stroke="#2563eb" stroke-width="3"/>
  <circle cx="180" cy="330" r="10" fill="#2563eb"/><circle cx="560" cy="330" r="10" fill="#2563eb"/><circle cx="370" cy="90" r="10" fill="#2563eb"/>
  <text x="160" y="365" font-family="Arial" font-size="20" fill="#111827">x₁</text>
  <text x="565" y="365" font-family="Arial" font-size="20" fill="#111827">x₂</text>
  <text x="380" y="70" font-family="Arial" font-size="20" fill="#111827">x₃</text>
  <line x1="120" y1="230" x2="620" y2="230" stroke="#dc2626" stroke-width="4"/>
  <text x="380" y="255" text-anchor="middle" font-family="Arial" font-size="18" fill="#dc2626">пример разделяющей прямой</text>
  <text x="380" y="400" text-anchor="middle" font-family="Arial" font-size="17" fill="#374151">Поворотом прямой можно реализовать любую из 2³ = 8 бинарных разметок</text>
</svg>
