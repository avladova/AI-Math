<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560"><rect width="1120" height="560" rx="22" fill="#f5f8fc"/><text x="42" y="48" font-family="Arial" font-size="29" font-weight="bold" fill="#17324d">Остатки против предсказанных значений</text><text x="42" y="80" font-family="Arial" font-size="17" fill="#526579">Одинаковая вертикальная ширина облака — гомоскедастичность; меняющаяся ширина — гетероскедастичность</text><g font-family="Arial"><g transform="translate(45 110)"><rect width="490" height="400" rx="15" fill="white" stroke="#cbd6e2"/><text x="245" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#25384c">Гомоскедастичность</text><path d="M55 315 H455 M55 80 V315 M55 197 H455" stroke="#8a99a9" stroke-width="2" fill="none"/><g fill="#2775b6"><circle cx="75" cy="170" r="5"/><circle cx="100" cy="230" r="5"/><circle cx="125" cy="145" r="5"/><circle cx="150" cy="260" r="5"/><circle cx="175" cy="185" r="5"/><circle cx="200" cy="125" r="5"/><circle cx="225" cy="220" r="5"/><circle cx="250" cy="165" r="5"/><circle cx="275" cy="270" r="5"/><circle cx="300" cy="140" r="5"/><circle cx="325" cy="215" r="5"/><circle cx="350" cy="175" r="5"/><circle cx="375" cy="245" r="5"/><circle cx="400" cy="135" r="5"/><circle cx="430" cy="205" r="5"/></g><text x="255" y="355" text-anchor="middle" font-size="16" fill="#526579">Предсказанное значение ŷᵢ →</text><text x="20" y="200" transform="rotate(-90 20 200)" text-anchor="middle" font-size="16" fill="#526579">Остаток eᵢ</text><text x="245" y="385" text-anchor="middle" font-size="16" fill="#26977d">Разброс примерно постоянный</text></g><g transform="translate(585 110)"><rect width="490" height="400" rx="15" fill="white" stroke="#cbd6e2"/><text x="245" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#25384c">Гетероскедастичность</text><path d="M55 315 H455 M55 80 V315 M55 197 H455" stroke="#8a99a9" stroke-width="2" fill="none"/><g fill="#e36b55"><circle cx="75" cy="185" r="5"/><circle cx="100" cy="205" r="5"/><circle cx="125" cy="170" r="5"/><circle cx="150" cy="220" r="5"/><circle cx="175" cy="145" r="5"/><circle cx="200" cy="255" r="5"/><circle cx="225" cy="125" r="5"/><circle cx="250" cy="275" r="5"/><circle cx="275" cy="105" r="5"/><circle cx="300" cy="290" r="5"/><circle cx="325" cy="90" r="5"/><circle cx="350" cy="300" r="5"/><circle cx="375" cy="75" r="5"/><circle cx="400" cy="310" r="5"/><circle cx="430" cy="65" r="5"/></g><text x="255" y="355" text-anchor="middle" font-size="16" fill="#526579">Предсказанное значение ŷᵢ →</text><text x="20" y="200" transform="rotate(-90 20 200)" text-anchor="middle" font-size="16" fill="#526579">Остаток eᵢ</text><text x="245" y="385" text-anchor="middle" font-size="16" fill="#e36b55">Разброс расширяется («воронка»)</text></g></g><text x="42" y="540" font-family="Arial" font-size="15" fill="#718096">Схематичные рисунки. Оценивайте общий рисунок облака, а не отдельные точки.</text></svg>