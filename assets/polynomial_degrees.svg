<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560"><rect width="1100" height="560" rx="22" fill="#f5f8fc"/><text x="48" y="55" font-family="Arial" font-size="30" font-weight="bold" fill="#17324d">Полиномиальная регрессия: три степени</text><text x="48" y="88" font-family="Arial" font-size="18" fill="#526579">Одна зашумлённая выборка, разная гибкость аппроксимации</text><g transform="translate(35 120)" font-family="Arial"><g><rect width="320" height="375" rx="16" fill="white" stroke="#cbd6e2"/><text x="160" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#25384c">Степень 1</text><path d="M38 285 H285 M38 285 V75" stroke="#8998a8" stroke-width="2"/><path d="M38 220 L285 135" stroke="#2775b6" stroke-width="5"/><g fill="#e36b55"><circle cx="55" cy="245" r="6"/><circle cx="85" cy="165" r="6"/><circle cx="115" cy="120" r="6"/><circle cx="145" cy="135" r="6"/><circle cx="175" cy="230" r="6"/><circle cx="205" cy="265" r="6"/><circle cx="235" cy="175" r="6"/><circle cx="265" cy="95" r="6"/></g><text x="160" y="330" text-anchor="middle" font-size="17" fill="#526579">Прямая не описывает волну</text><text x="160" y="355" text-anchor="middle" font-size="16" fill="#2775b6">Высокое смещение</text></g><g transform="translate(370)"><rect width="320" height="375" rx="16" fill="white" stroke="#cbd6e2"/><text x="160" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#25384c">Степень 3</text><path d="M38 285 H285 M38 285 V75" stroke="#8998a8" stroke-width="2"/><path d="M38 225 C80 85 125 75 155 165 S230 300 285 135" stroke="#26977d" stroke-width="5" fill="none"/><g fill="#e36b55"><circle cx="55" cy="245" r="6"/><circle cx="85" cy="165" r="6"/><circle cx="115" cy="120" r="6"/><circle cx="145" cy="135" r="6"/><circle cx="175" cy="230" r="6"/><circle cx="205" cy="265" r="6"/><circle cx="235" cy="175" r="6"/><circle cx="265" cy="95" r="6"/></g><text x="160" y="330" text-anchor="middle" font-size="17" fill="#526579">Одна плавная волна</text><text x="160" y="355" text-anchor="middle" font-size="16" fill="#26977d">Умеренная гибкость</text></g><g transform="translate(740)"><rect width="320" height="375" rx="16" fill="white" stroke="#cbd6e2"/><text x="160" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#25384c">Степень 15</text><path d="M38 285 H285 M38 285 V75" stroke="#8998a8" stroke-width="2"/><path d="M38 245 C48 70 65 290 85 165 S105 60 115 120 S137 255 155 135 S170 310 190 230 S205 300 225 265 S240 80 255 175 S270 70 285 95" stroke="#e36b55" stroke-width="5" fill="none"/><g fill="#e36b55"><circle cx="55" cy="245" r="6"/><circle cx="85" cy="165" r="6"/><circle cx="115" cy="120" r="6"/><circle cx="145" cy="135" r="6"/><circle cx="175" cy="230" r="6"/><circle cx="205" cy="265" r="6"/><circle cx="235" cy="175" r="6"/><circle cx="265" cy="95" r="6"/></g><text x="160" y="330" text-anchor="middle" font-size="17" fill="#526579">Подстраивается под точки</text><text x="160" y="355" text-anchor="middle" font-size="16" fill="#e36b55">Высокий разброс</text></g></g><text x="550" y="515" text-anchor="middle" font-family="Arial" font-size="16" fill="#526579">Признак x →</text><text x="15" y="300" transform="rotate(-90 15 300)" font-family="Arial" font-size="16" fill="#526579">Отклик y</text><text x="48" y="530" font-family="Arial" font-size="15" fill="#718096">Схема иллюстративная; кривые не являются результатом конкретного численного эксперимента.</text></svg>