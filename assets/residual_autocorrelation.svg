<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650"><rect width="1120" height="650" rx="22" fill="#f5f8fc"/><text x="42" y="48" font-family="Arial" font-size="29" font-weight="bold" fill="#17324d">Автокорреляция: как выглядят остатки во времени</text><text x="42" y="80" font-family="Arial" font-size="17" fill="#526579">По горизонтали — время или номер наблюдения t; по вертикали — остаток eₜ</text><g font-family="Arial"><g transform="translate(35 110)"><rect width="330" height="470" rx="15" fill="white" stroke="#cbd6e2"/><text x="165" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#25384c">Нет заметной автокорреляции</text><path d="M45 370 H300 M45 90 V370 M45 230 H300" stroke="#8a99a9" stroke-width="2" fill="none"/><path d="M45 230 L70 160 L95 280 L120 195 L145 250 L170 140 L195 300 L220 205 L245 265 L270 170 L300 235" stroke="#2775b6" stroke-width="3.5" fill="none"/><g fill="#2775b6"><circle cx="70" cy="160" r="4"/><circle cx="95" cy="280" r="4"/><circle cx="120" cy="195" r="4"/><circle cx="145" cy="250" r="4"/><circle cx="170" cy="140" r="4"/><circle cx="195" cy="300" r="4"/><circle cx="220" cy="205" r="4"/><circle cx="245" cy="265" r="4"/><circle cx="270" cy="170" r="4"/></g><text x="172" y="410" text-anchor="middle" font-size="15" fill="#526579">Время / номер наблюдения t →</text><text x="17" y="230" transform="rotate(-90 17 230)" text-anchor="middle" font-size="15" fill="#526579">Остаток eₜ</text><text x="165" y="450" text-anchor="middle" font-size="16" fill="#26977d">Смена знака без длинных серий</text></g><g transform="translate(395 110)"><rect width="330" height="470" rx="15" fill="white" stroke="#cbd6e2"/><text x="165" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#25384c">Положительная</text><path d="M45 370 H300 M45 90 V370 M45 230 H300" stroke="#8a99a9" stroke-width="2" fill="none"/><path d="M45 230 C70 130 95 115 120 145 S170 330 195 315 S245 115 270 130 S290 180 300 170" stroke="#e36b55" stroke-width="4" fill="none"/><text x="172" y="410" text-anchor="middle" font-size="15" fill="#526579">Время / номер наблюдения t →</text><text x="17" y="230" transform="rotate(-90 17 230)" text-anchor="middle" font-size="15" fill="#526579">Остаток eₜ</text><text x="165" y="450" text-anchor="middle" font-size="16" fill="#e36b55">Длинные серии одного знака</text></g><g transform="translate(755 110)"><rect width="330" height="470" rx="15" fill="white" stroke="#cbd6e2"/><text x="165" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#25384c">Отрицательная</text><path d="M45 370 H300 M45 90 V370 M45 230 H300" stroke="#8a99a9" stroke-width="2" fill="none"/><path d="M45 130 L65 320 L85 135 L105 320 L125 135 L145 320 L165 135 L185 320 L205 135 L225 320 L245 135 L265 320 L285 135 L300 230" stroke="#7b65b2" stroke-width="3.5" fill="none"/><text x="172" y="410" text-anchor="middle" font-size="15" fill="#526579">Время / номер наблюдения t →</text><text x="17" y="230" transform="rotate(-90 17 230)" text-anchor="middle" font-size="15" fill="#526579">Остаток eₜ</text><text x="165" y="450" text-anchor="middle" font-size="16" fill="#7b65b2">Частое чередование знаков</text></g></g><text x="42" y="620" font-family="Arial" font-size="15" fill="#718096">Схематичные рисунки: в реальных данных точки не обязаны образовывать гладкую линию.</text></svg>