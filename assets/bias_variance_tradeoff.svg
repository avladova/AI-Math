<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="570" viewBox="0 0 1100 570"><rect width="1100" height="570" rx="22" fill="#f5f8fc"/><text x="48" y="55" font-family="Arial" font-size="30" font-weight="bold" fill="#17324d">Компромисс смещения и разброса</text><text x="48" y="88" font-family="Arial" font-size="18" fill="#526579">Типичная схема изменения составляющих при усложнении модели</text><path d="M110 440 V140 M110 440 H1010" stroke="#526579" stroke-width="2.5" fill="none"/><path d="M110 160 C260 330 420 370 610 375 S850 380 1000 380" stroke="#2775b6" stroke-width="5" fill="none"/><path d="M110 415 C330 410 500 360 660 280 S870 170 1000 145" stroke="#e36b55" stroke-width="5" fill="none"/><path d="M110 220 C280 330 420 350 570 330 S820 270 1000 245" stroke="#26977d" stroke-width="5" fill="none"/><path d="M585 330 V440" stroke="#7b65b2" stroke-width="2" stroke-dasharray="7 6"/><circle cx="585" cy="330" r="8" fill="#7b65b2"/><g font-family="Arial" font-size="18" fill="#25384c"><text x="560" y="490" text-anchor="middle">Сложность модели →</text><text x="45" y="290" transform="rotate(-90 45 290)" text-anchor="middle">Ошибка</text><text x="110" y="465">Простая</text><text x="1000" y="465" text-anchor="end">Гибкая</text><line x1="720" y1="125" x2="765" y2="125" stroke="#2775b6" stroke-width="5"/><text x="778" y="131">Bias²</text><line x1="720" y1="160" x2="765" y2="160" stroke="#e36b55" stroke-width="5"/><text x="778" y="166">Variance</text><line x1="720" y1="195" x2="765" y2="195" stroke="#26977d" stroke-width="5"/><text x="778" y="201">Суммарная ошибка</text><text x="585" y="300" text-anchor="middle" fill="#66529b">Баланс</text></g><text x="48" y="540" font-family="Arial" font-size="15" fill="#718096">Схематично: реальные кривые зависят от данных, модели и функции потерь.</text></svg>